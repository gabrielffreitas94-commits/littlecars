{% extends "base.html" %}

{% block title %}Modelos de Carros | LittleCars{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-title-group">
    <h1>🏷️ Modelos de Veículos</h1>
    <p>Cadastre os modelos de carros associados a cada marca para organizar sua garagem.</p>
  </div>
  <div class="page-actions">
    <button 
      class="btn btn-primary" 
      hx-get="/modelos/modal/novo" 
      hx-target="#modal-container"
    >
      + Novo Modelo
    </button>
  </div>
</div>

<!-- Filtros Rápidos -->
<div class="filter-panel">
  <div class="filter-form" style="grid-template-columns: 2fr 1.5fr auto;">
    <div class="form-group">
      <label class="form-label">Buscar Modelo ou Carroceria</label>
      <input 
        type="text" 
        name="busca" 
        class="form-control" 
        placeholder="🔍 Digite para pesquisar modelo..." 
        value="{{ busca }}"
        hx-get="/modelos" 
        hx-include="[name='marca_id']"
        hx-trigger="keyup changed delay:250ms, search" 
        hx-target="#modelos-list-container"
      >
    </div>

    <div class="form-group">
      <label class="form-label">Filtrar por Marca</label>
      <select 
        name="marca_id" 
        class="form-control"
        hx-get="/modelos" 
        hx-include="[name='busca']"
        hx-trigger="change" 
        hx-target="#modelos-list-container"
      >
        <option value="">Todas as Marcas</option>
        {% for m in marcas %}
        <option value="{{ m.id }}" {% if marca_id_selecionada == m.id %}selected{% endif %}>
          {{ m.nome }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <a href="/modelos" class="btn btn-secondary">Limpar Filtros</a>
    </div>
  </div>
</div>

<!-- Lista de Modelos -->
<div id="modelos-list-container">
  {% include "modelos/partials/list.html" %}
</div>
{% endblock %}
